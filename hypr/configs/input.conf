input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        tap-and-drag = true
        drag_lock = true
        scroll_factor = 0.5
        drag_3fg = false
    }
}

# Per-device: adaptive acceleration for ELAN touchpad only
device {
    name = elan07f0:00-04f3:32ed-touchpad
    accel_profile = adaptive
    sensitivity = 0.2
}

# Windows/macOS style fluid workspace swipe gestures
gestures {
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 10
    workspace_swipe_cancel_ratio = 0.3
    workspace_swipe_create_new = true
    workspace_swipe_forever = true
    workspace_swipe_touch = true
}
